name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Check backend syntax
        run: npm run check --prefix backend
      - name: Lint application and tests
        run: |
          npm run lint --prefix backend
          npm run lint --prefix frontend
      - name: Fast behavior and component tests
        run: |
          npm run test:unit --prefix backend
          npm run test --prefix frontend
      - name: MongoDB replica-set integration tests
        run: npm run test:integration --prefix backend
      - name: Check API contract drift
        run: npm run docs:check --prefix backend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Synthetic customer and admin browser checks
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Audit dependencies
        run: |
          npm audit --prefix backend --audit-level=moderate
          npm audit --prefix frontend --audit-level=moderate
